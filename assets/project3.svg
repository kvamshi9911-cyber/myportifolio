<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923" />
      <stop offset="100%" stop-color="#003554" />
    </linearGradient>
    <linearGradient id="p3-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p3-bg)" />

  <!-- Phone Frame Mockup Center -->
  <rect x="180" y="20" width="240" height="340" rx="28" fill="#0b132b" stroke="#1c2541" stroke-width="4" />
  <!-- Dynamic Island Notch -->
  <rect x="255" y="32" width="90" height="18" rx="9" fill="#000000" />
  <circle cx="330" cy="41" r="3.5" fill="#1e293b" />

  <!-- Mobile Screen Content -->
  <!-- Header -->
  <text x="205" y="75" fill="#94a3b8" font-family="sans-serif" font-size="11">Good Morning,</text>
  <text x="205" y="93" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">Alex Morgan</text>
  <circle cx="395" cy="80" r="14" fill="#3a86ff" opacity="0.8" />

  <!-- Virtual Card -->
  <rect x="200" y="110" width="200" height="110" rx="14" fill="url(#p3-card)" />
  <text x="215" y="132" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" opacity="0.9">Nova Black Platinum</text>
  <text x="215" y="165" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">•••• 4892</text>
  <text x="215" y="195" fill="#e0f2fe" font-family="sans-serif" font-size="10">Balance</text>
  <text x="215" y="210" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">$48,250.70</text>
  <circle cx="370" cy="195" r="12" fill="#ffffff" opacity="0.25" />
  <circle cx="382" cy="195" r="12" fill="#ffffff" opacity="0.2" />

  <!-- Quick Action Buttons -->
  <g transform="translate(200, 230)">
    <circle cx="20" cy="18" r="16" fill="#1c2541" />
    <text x="20" y="23" fill="#00a896" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">↑</text>
    <text x="20" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Send</text>

    <circle cx="73" cy="18" r="16" fill="#1c2541" />
    <text x="73" y="23" fill="#3a86ff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">↓</text>
    <text x="73" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Receive</text>

    <circle cx="126" cy="18" r="16" fill="#1c2541" />
    <text x="126" y="23" fill="#ffb703" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⇄</text>
    <text x="126" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Swap</text>

    <circle cx="180" cy="18" r="16" fill="#1c2541" />
    <text x="180" y="23" fill="#fb8500" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">⚙</text>
    <text x="180" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">More</text>
  </g>

  <!-- Recent Transactions Mini List -->
  <rect x="200" y="285" width="200" height="26" rx="6" fill="#1c2541" opacity="0.6" />
  <circle cx="214" cy="298" r="7" fill="#10b981" />
  <text x="228" y="302" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Stripe Payout</text>
  <text x="390" y="302" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="end">+$3,400</text>

  <rect x="200" y="318" width="200" height="26" rx="6" fill="#1c2541" opacity="0.6" />
  <circle cx="214" cy="331" r="7" fill="#ef4444" />
  <text x="228" y="335" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">AWS Cloud Svc</text>
  <text x="390" y="335" fill="#f87171" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="end">-$412.50</text>
</svg>
