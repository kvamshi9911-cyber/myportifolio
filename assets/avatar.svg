<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cloth-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.35" flood-color="#4f46e5" />
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#bg-grad)" filter="url(#shadow)" opacity="0.95" />
  
  <!-- Subtle Grid Accent -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />

  <!-- Developer Silhouette / Illustration -->
  <g transform="translate(0, 20)">
    <!-- Shoulders / Jacket -->
    <path d="M110 320 Q140 260 200 260 Q260 260 290 320 L310 360 L90 360 Z" fill="url(#cloth-grad)" />
    <!-- T-shirt collar -->
    <path d="M170 260 Q200 285 230 260 Q215 310 200 310 Q185 310 170 260 Z" fill="#3b82f6" />
    
    <!-- Neck -->
    <rect x="180" y="210" width="40" height="60" rx="8" fill="#f87171" opacity="0.9" />
    
    <!-- Face / Head -->
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="#fca5a5" />
    
    <!-- Modern Glasses -->
    <rect x="155" y="165" width="38" height="26" rx="6" fill="#0f172a" opacity="0.8" />
    <rect x="207" y="165" width="38" height="26" rx="6" fill="#0f172a" opacity="0.8" />
    <line x1="193" y1="178" x2="207" y2="178" stroke="#0f172a" stroke-width="4" />
    <!-- Glass Glare -->
    <line x1="160" y1="170" x2="185" y2="185" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />
    <line x1="212" y1="170" x2="237" y2="185" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />

    <!-- Modern Haircut -->
    <path d="M140 160 Q145 110 200 110 Q255 110 260 160 Q240 130 200 135 Q160 140 140 160 Z" fill="#1e293b" />
    
    <!-- Smile -->
    <path d="M185 215 Q200 228 215 215" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round" />

    <!-- Code badges floating -->
    <g transform="translate(60, 150) rotate(-12)">
      <rect width="64" height="30" rx="15" fill="#0f172a" opacity="0.9" stroke="#6366f1" stroke-width="2"/>
      <text x="32" y="20" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">&lt;dev/&gt;</text>
    </g>

    <g transform="translate(280, 170) rotate(10)">
      <rect width="60" height="30" rx="15" fill="#0f172a" opacity="0.9" stroke="#06b6d4" stroke-width="2"/>
      <text x="30" y="20" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">{JS}</text>
    </g>
  </g>
</svg>
