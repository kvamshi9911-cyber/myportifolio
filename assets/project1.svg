  <rect y="30" width="600" height="12" fill="#1e293b" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="100" y="12" width="280" height="18" rx="6" fill="#334155" opacity="0.6" />
