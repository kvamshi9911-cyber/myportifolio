  <rect x="35" y="105" width="70" height="10" rx="4" fill="#475569" />
  <rect x="35" y="130" width="65" height="10" rx="4" fill="#475569" />
  <rect x="35" y="155" width="75" height="10" rx="4" fill="#475569" />
  <rect x="35" y="180" width="50" height="10" rx="4" fill="#475569" />

  <!-- Main Content Dashboard -->
  <!-- Stats Cards -->
