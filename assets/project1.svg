  <text x="160" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Revenue</text>
  <text x="160" y="108" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">$124,500</text>
  <text x="235" y="108" fill="#10b981" font-family="sans-serif" font-size="11">↑ 18.2%</text>

  <rect x="295" y="58" width="135" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="310" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">Active Users</text>
  <text x="310" y="108" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">42,890</text>
  <text x="385" y="108" fill="#10b981" font-family="sans-serif" font-size="11">↑ 24.5%</text>

  <rect x="445" y="58" width="135" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="460" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">AI Model Accuracy</text>
  <text x="460" y="108" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">99.4%</text>
  <text x="535" y="108" fill="#06b6d4" font-family="sans-serif" font-size="11">v4.2</text>

  <!-- Large Chart Area -->
