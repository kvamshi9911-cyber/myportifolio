  <!-- Spline Curve Overlay -->
  <path d="M190 270 Q240 190 290 220 T390 180 T480 160 T550 140" fill="none" stroke="#a855f7" stroke-width="3.5" />
  <circle cx="550" cy="140" r="5" fill="#c084fc" stroke="#1e1b4b" stroke-width="2" />
