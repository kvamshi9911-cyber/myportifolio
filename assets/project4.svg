<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p4-bg)" />

  <!-- Terminal Window Header -->
  <rect width="600" height="42" rx="16" fill="#1f2937" />
  <rect y="30" width="600" height="12" fill="#1f2937" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <text x="300" y="26" fill="#9ca3af" font-family="monospace" font-size="12" text-anchor="middle">orbit-ci/pipeline-runner --prod</text>

  <!-- CI/CD Nodes Pipeline Flow -->
  <g transform="translate(30, 65)">
    <!-- Stage 1: Lint & Build -->
    <rect x="0" y="20" width="115" height="70" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="40" r="6" fill="#10b981" />
    <text x="34" y="44" fill="#f9fafb" font-family="sans-serif" font-size="11" font-weight="bold">Lint &amp; Build</text>
    <text x="20" y="70" fill="#9ca3af" font-family="monospace" font-size="9">Passed · 42s</text>

    <!-- Connector Line 1 -->
    <line x1="115" y1="55" x2="145" y2="55" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />

    <!-- Stage 2: Unit Tests -->
    <rect x="145" y="20" width="115" height="70" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5" />
    <circle cx="165" cy="40" r="6" fill="#10b981" />
    <text x="179" y="44" fill="#f9fafb" font-family="sans-serif" font-size="11" font-weight="bold">Unit &amp; E2E</text>
    <text x="165" y="70" fill="#9ca3af" font-family="monospace" font-size="9">312/312 · 1m 15s</text>

    <!-- Connector Line 2 -->
    <line x1="260" y1="55" x2="290" y2="55" stroke="#10b981" stroke-width="2" />

    <!-- Stage 3: Dockerize -->
    <rect x="290" y="20" width="115" height="70" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="310" cy="40" r="6" fill="#3b82f6" />
    <text x="324" y="44" fill="#f9fafb" font-family="sans-serif" font-size="11" font-weight="bold">Containerize</text>
    <text x="310" y="70" fill="#9ca3af" font-family="monospace" font-size="9">multi-arch · 58s</text>

    <!-- Connector Line 3 -->
    <line x1="405" y1="55" x2="435" y2="55" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4" />

    <!-- Stage 4: Deploy K8s -->
    <rect x="435" y="20" width="115" height="70" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="455" cy="40" r="6" fill="#8b5cf6" />
    <text x="469" y="44" fill="#f9fafb" font-family="sans-serif" font-size="11" font-weight="bold">K8s Rollout</text>
    <text x="455" y="70" fill="#9ca3af" font-family="monospace" font-size="9">Zero-downtime</text>
  </g>

  <!-- Live Terminal Console Stream -->
  <rect x="30" y="180" width="540" height="175" rx="8" fill="#030712" stroke="#374151" stroke-width="1" />
  <g transform="translate(45, 205)" font-family="monospace" font-size="11">
    <text y="0" fill="#10b981">✔ [Pipeline] Triggered by push to main (commit #7f4b82d)</text>
    <text y="24" fill="#60a5fa">ℹ [Docker] Building OCI image tag: registry.cloud/app:v2.14.0</text>
    <text y="48" fill="#e5e7eb">▶ [K8s] Helm upgrade --install cluster-prod ./deploy/helm</text>
    <text y="72" fill="#9ca3af">  deployment.apps/gateway-svc configured</text>
    <text y="94" fill="#9ca3af">  ingress.networking.k8s.io/prod-ingress synced</text>
    <text y="118" fill="#34d399">✨ [Success] Deployment finished across 12 pods in 3 clusters (4 regions).</text>
    <text y="140" fill="#f59e0b">⚡ Active Health Check: 100% healthy. Latency: 18ms</text>
  </g>
</svg>
