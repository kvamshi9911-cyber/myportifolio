<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#3f3f46" />
    </pattern>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p5-bg)" />
  <rect x="10" y="50" width="580" height="320" rx="10" fill="url(#dot-grid)" />

  <!-- Canvas App Top Bar -->
  <rect width="600" height="44" rx="16" fill="#18181b" />
  <rect y="32" width="600" height="12" fill="#18181b" />
  <circle cx="30" cy="22" r="7" fill="#6366f1" />
  <text x="46" y="27" fill="#fafafa" font-family="sans-serif" font-size="13" font-weight="bold">CollabCanvas Infinite</text>

  <!-- Collaborative Avatars in Header -->
  <circle cx="480" cy="22" r="12" fill="#ec4899" stroke="#18181b" stroke-width="2" />
  <text x="480" y="26" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">SJ</text>
  <circle cx="505" cy="22" r="12" fill="#3b82f6" stroke="#18181b" stroke-width="2" />
  <text x="505" y="26" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">AM</text>
  <circle cx="530" cy="22" r="12" fill="#10b981" stroke="#18181b" stroke-width="2" />
  <text x="530" y="26" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">DK</text>
  <rect x="555" y="12" width="30" height="20" rx="10" fill="#3f3f46" />
  <text x="570" y="26" fill="#a1a1aa" font-family="sans-serif" font-size="10" text-anchor="middle">+4</text>

  <!-- Canvas Floating Toolbar -->
  <rect x="210" y="65" width="180" height="34" rx="17" fill="#27272a" stroke="#52525b" stroke-width="1" />
  <circle cx="232" cy="82" r="11" fill="#6366f1" />
  <text x="232" y="86" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">↗</text>
  <circle cx="264" cy="82" r="11" fill="#3f3f46" />
  <text x="264" y="86" fill="#d4d4d8" font-family="sans-serif" font-size="11" text-anchor="middle">▢</text>
  <circle cx="296" cy="82" r="11" fill="#3f3f46" />
  <text x="296" y="86" fill="#d4d4d8" font-family="sans-serif" font-size="11" text-anchor="middle">◯</text>
  <circle cx="328" cy="82" r="11" fill="#3f3f46" />
  <text x="328" y="86" fill="#d4d4d8" font-family="sans-serif" font-size="11" text-anchor="middle">T</text>
  <circle cx="360" cy="82" r="11" fill="#3f3f46" />
  <text x="360" y="86" fill="#d4d4d8" font-family="sans-serif" font-size="11" text-anchor="middle">✎</text>

  <!-- Canvas Objects -->
  <!-- Sticky Note 1 -->
  <rect x="70" y="140" width="130" height="130" rx="8" fill="#fef08a" transform="rotate(-4 70 140)" />
  <text x="80" y="175" fill="#713f12" font-family="sans-serif" font-size="12" font-weight="bold">User Flow V2</text>
  <text x="80" y="195" fill="#854d0e" font-family="sans-serif" font-size="10">• One-click auth</text>
  <text x="80" y="215" fill="#854d0e" font-family="sans-serif" font-size="10">• WebSockets CRDT</text>
  <text x="80" y="235" fill="#854d0e" font-family="sans-serif" font-size="10">• Instant sync</text>

  <!-- UI Frame Card -->
  <rect x="250" y="130" width="220" height="170" rx="10" fill="#18181b" stroke="#6366f1" stroke-width="2" />
  <rect x="250" y="130" width="220" height="30" rx="10" fill="#27272a" />
  <circle cx="265" cy="145" r="4" fill="#ef4444" />
  <circle cx="277" cy="145" r="4" fill="#f59e0b" />
  <circle cx="289" cy="145" r="4" fill="#10b981" />
  <text x="360" y="150" fill="#a1a1aa" font-family="sans-serif" font-size="10" text-anchor="middle">App Component</text>
  <rect x="270" y="180" width="180" height="45" rx="6" fill="#3f3f46" />
  <rect x="270" y="240" width="80" height="30" rx="6" fill="#6366f1" />
  <rect x="360" y="240" width="90" height="30" rx="6" fill="#3f3f46" />

  <!-- Multi-user live cursor 1 -->
  <g transform="translate(190, 260)">
    <path d="M0 0 L14 14 L8 15 L12 24 L8 26 L4 17 L0 20 Z" fill="#ec4899" />
    <rect x="14" y="16" width="68" height="18" rx="4" fill="#ec4899" />
    <text x="48" y="29" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Sarah (Lead)</text>
  </g>

  <!-- Multi-user live cursor 2 -->
  <g transform="translate(420, 210)">
    <path d="M0 0 L14 14 L8 15 L12 24 L8 26 L4 17 L0 20 Z" fill="#10b981" />
    <rect x="14" y="16" width="64" height="18" rx="4" fill="#10b981" />
    <text x="46" y="29" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">David (Dev)</text>
  </g>
</svg>
